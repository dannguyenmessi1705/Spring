receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:

exporters:
  otlp/quickwit:
    endpoint: host.docker.internal:7281 # If is Mac/Windows use host.docker.internal:7281
    tls:
      insecure: true

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/quickwit]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/quickwit]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/quickwit]