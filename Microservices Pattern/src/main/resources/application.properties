# Cau hinh Circuit Breaker cho service review
## Cau hinh loai sliding window la count_based (dem so luong request)
resilience4j.circuitbreaker.instances.review-service.sliding-window-type=count_based
## Cau hinh kich thuoc sliding window la 4 request de tinh toan ti le that bai
resilience4j.circuitbreaker.instances.review-service.sliding-window-size=4
## Cau hinh toi thieu so luong request la 2 request trong sliding window de bat dau tinh toan ti le that bai
resilience4j.circuitbreaker.instances.review-service.minimum-number-of-calls=2
## Cau hinh ti le that bai la 50% de mo Circuit Breaker
resilience4j.circuitbreaker.instances.review-service.failure-rate-threshold=50
## Cau hinh thoi gian cho Circuit Breaker o trang thai OPEN la 10 giay
resilience4j.circuitbreaker.instances.review-service.wait-duration-in-open-state=10
## Cau hinh so luong request duoc phep di qua khi o trang thai HALF_OPEN la 2 request
resilience4j.circuitbreaker.instances.review-service.permitted-number-of-calls-in-half-open-state=2
## Cau hinh nhung ngoai le duoc tinh la that bai
resilience4j.circuitbreaker.instances.review-service.record-exceptions[0]=org.springframework.web.reactive.function.client.WebClientResponseException
resilience4j.circuitbreaker.instances.review-service.record-exceptions[1]=java.util.concurrent.TimeoutException

rate_limiter.product.service=http://localhost:7070/sec09/product/
rate_limiter.review.service=http://localhost:7070/sec09/review/
# Cau hinh Rate Limiter cho calculator service
## Cau hinh gioi han chu ky lam moi la 20 giay (Day la thoi gian de cap nhat lai so luong request duoc phep di qua)
resilience4j.ratelimiter.instances.calculator-service.limit-refresh-period=20s
## Cau hinh so luong request toi da duoc phep di qua trong moi chu ky lam moi
resilience4j.ratelimiter.instances.calculator-service.limit-for-period=5
## Cau hinh thoi gian cho phep de chap nhan request (neu trong thoi gian nay ma khong co luong request duoc phep di qua thi se bi tu choi)
resilience4j.ratelimiter.instances.calculator-service.timeout-duration=5s

# Cau hinh Rate Limiter cho review service
## Cau hinh gioi han chu ky lam moi la 20 giay (Day la thoi gian de cap nhat lai so luong request duoc phep di qua)
resilience4j.ratelimiter.instances.review-service.limit-refresh-period=20s
## Cau hinh so luong request toi da duoc phep di qua trong moi chu ky lam moi
resilience4j.ratelimiter.instances.review-service.limit-for-period=3
## Cau hinh thoi gian cho phep de chap nhan request (neu trong thoi gian nay ma khong co luong request duoc phep di qua thi se bi tu choi)
resilience4j.ratelimiter.instances.review-service.timeout-duration=0s